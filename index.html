<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salary Calculator</title>

  <!-- ============ CSS: how the page LOOKS ============ -->
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 24px 16px;
    }

    .card {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    h1 { margin-top: 0; font-size: 1.5rem; }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }

    #results { margin-top: 20px; }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .row.total { font-weight: 700; color: #16a34a; border-bottom: none; }
  </style>
</head>

<body>
  <!-- ============ HTML: what is ON the page ============ -->
  <div class="card">
    <h1>💼 Employee Salary Calculator</h1>

    <label for="name">Employee name</label>
    <input id="name" type="text" placeholder="e.g. Alex">

    <label for="payType">Pay type</label>
    <select id="payType">
      <option value="hourly">Hourly</option>
      <option value="yearly">Yearly salary</option>
    </select>

    <label for="rate">Pay rate ($ per hour, or $ per year)</label>
    <input id="rate" type="number" placeholder="e.g. 20">

    <label for="hours">Hours worked per week</label>
    <input id="hours" type="number" value="40">

    <label for="tax">Tax / deductions (%)</label>
    <input id="tax" type="number" value="20">

    <button onclick="calculate()">Calculate</button>

    <div id="results"></div>
  </div>

  <!-- ============ JavaScript: what the page DOES ============ -->
  <script>
    function calculate() {
      // 1. INPUT: read what the user typed
      const name    = document.getElementById("name").value || "Employee";
      const payType = document.getElementById("payType").value;
      const rate    = Number(document.getElementById("rate").value);
      const hours   = Number(document.getElementById("hours").value);
      const taxPct  = Number(document.getElementById("tax").value);

      // Stop if the pay rate is missing
      if (rate <= 0) {
        alert("Please enter a pay rate.");
        return;
      }

      // 2. PROCESS: do the math
      let yearlyGross;
      if (payType === "hourly") {
        // Overtime: hours above 40 are paid 1.5x
        const regularHours  = Math.min(hours, 40);
        const overtimeHours = Math.max(hours - 40, 0);
        const weeklyPay = regularHours * rate + overtimeHours * rate * 1.5;
        yearlyGross = weeklyPay * 52;
      } else {
        yearlyGross = rate;
      }

      const yearlyTax = yearlyGross * (taxPct / 100);
      const yearlyNet = yearlyGross - yearlyTax;

      // 3. OUTPUT: show the results on the page
      document.getElementById("results").innerHTML = `
        <h3>Results for ${name}</h3>
        <div class="row"><span>Gross per year</span><span>${money(yearlyGross)}</span></div>
        <div class="row"><span>Gross per month</span><span>${money(yearlyGross / 12)}</span></div>
        <div class="row"><span>Gross per week</span><span>${money(yearlyGross / 52)}</span></div>
        <div class="row"><span>Tax (${taxPct}%)</span><span>−${money(yearlyTax)}</span></div>
        <div class="row total"><span>Take-home per month</span><span>${money(yearlyNet / 12)}</span></div>
      `;
    }

    // Helper: turns 1234.5 into "$1,234.50"
    function money(amount) {
      return "$" + amount.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }
  </script>
</body>
</html>
